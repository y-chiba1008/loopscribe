[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "loopscribe"
version = "1.1.0"
description = "Windowsのシステム音声(WASAPIループバック)をローカルで日本語文字起こしするCLI"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "faster-whisper>=1.1.0",
    # 1.2.1 は av.open(metadata_errors=...) を渡す。PyAV 19 で引数が削除され、
    # 修正は未リリース(master の PR #1495)なので 19 未満に固定する。
    "av>=11,<19",
    "numpy>=2.1",
    "soxr>=0.5.0",
    "typer>=0.15.0",
    "rich>=13.9",
    # WASAPIループバック取得。Windows専用のため、WSL(Linux)では自動的にスキップされる。
    "pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'",
    "tomli-w>=1.2.0",
]

[project.scripts]
loopscribe = "loopscribe.cli:app"

[dependency-groups]
dev = [
    # 検証用音声の取得。datasets 4 は ReazonSpeech の読み込みスクリプトを実行できない。
    # アプリ本体ではなく、エディタと `uv sync` の環境から import できるようにする。
    "datasets>=3.2,<4",
    "psutil>=6.0",
    "pyrefly>=1.4",
    "pytest>=8.3",
    "ruff>=0.8",
    "soundfile>=0.12.1",
    "types-psutil>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loopscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: 実モデルを使う遅いテスト(既定ではスキップ。`uv run pytest -m slow` で実行)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
# scripts/ 同士の import と `tests.cer` を解決する(実行時は sys.path 操作や pytest が担う)
search-path = [".", "scripts"]
python-version = "3.13"
# pyaudiowpatch は Windows 専用で、WSL では入らない。
# wasapi.py 内でだけ遅延 import するので、解決できなくても警告にしない。
replace-imports-with-any = ["pyaudiowpatch"]
